name: MetaMuseum validation and manual release
on:
  push:
    branches: [master, 'codex/**']
  pull_request:
  workflow_dispatch:
    inputs:
      operation:
        description: Explicit operation; production inspection is read-only
        type: choice
        options: [validate, inventory]
        default: inventory
permissions:
  contents: read
concurrency:
  group: metamuseum-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && (inputs.operation || 'inventory') || 'validate' }}
  cancel-in-progress: false
jobs:
  quality:
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'validate'
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27028:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'"
          --health-interval 2s --health-timeout 5s --health-retries 30
      rtsp:
        image: bluenviron/mediamtx:1.21.3
        ports: ['8554:8554']
        env:
          MTX_RTSPTRANSPORTS: tcp
    env:
      RTSP_FIXTURE_URL: rtsp://127.0.0.1:8554/fixture
      SECRET_KEY: ci-local-session-secret
      SECURITY_PASSWORD_SALT: ci-local-confirmation-salt
      MONGODB_URI: mongodb://127.0.0.1:27028/metamuseum_test?directConnection=true
      MONGODB_DB: metamuseum_test
      ENVIRONMENT: test
      ALLOWED_ORIGINS: '["http://127.0.0.1:5173","http://localhost:5173","http://127.0.0.1:8000"]'
      MEDIA_ROOT: backend/metamuseum/static
      FRONTEND_ROOT: frontend/dist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies and FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install --require-hashes -r backend/requirements-dev.lock
          pip install --no-deps -e backend
          npm --prefix frontend ci
          cd frontend && npx playwright install --with-deps chromium firefox webkit
      - name: Mark isolated Mongo instance
        run: docker exec -i ${{ job.services.mongo.id }} mongosh --quiet < backend/tests/fixtures/mongo-init.js
      - name: Generate media and publish controlled RTSP
        run: |
          python frontend/tests/fixtures/generate_media.py
          ffmpeg -hide_banner -loglevel warning -re -stream_loop -1 \
            -i frontend/tests/fixtures/media/video.mp4 -c copy -f rtsp -rtsp_transport tcp \
            "$RTSP_FIXTURE_URL" > /tmp/metamuseum-rtsp.log 2>&1 &
          echo $! > /tmp/metamuseum-rtsp.pid
          for i in $(seq 1 20); do
            if ffprobe -v error -timeout 3000000 -rtsp_transport tcp \
              -show_entries stream=codec_name -of csv=p=0 "$RTSP_FIXTURE_URL"; then exit 0; fi
            sleep 1
          done
          cat /tmp/metamuseum-rtsp.log
          exit 1
      - name: Python integration and compatibility
        run: python -m pytest backend/tests -q
      - name: React, legacy behavior, renderer, types and build
        run: |
          npm --prefix frontend test
          npm --prefix frontend run build
          npm --prefix frontend audit --audit-level=high
      - name: Seed synthetic browser fixtures
        run: |
          python backend/tests/fixtures/seed.py
          python scripts/import_wall_presets.py
      - name: Browser tests against actual API and Socket.IO
        run: |
          python frontend/tests/fixtures/server.py > /tmp/metamuseum-media.log 2>&1 &
          uvicorn metamuseum.asgi:app --host 127.0.0.1 --port 8000 > /tmp/metamuseum-api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          npm --prefix frontend run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics
          path: |
            frontend/playwright-report
            frontend/test-results
            /tmp/metamuseum-*.log
      - name: Build clean runtime image
        run: docker build -t metamuseum:ci .
      - name: Runtime smoke against real Mongo
        run: |
          docker network create metamuseum_ci
          docker run -d --name ci_mongo --network metamuseum_ci --network-alias mongo mongo:7
          docker run -d --name ci_smoke --network metamuseum_ci -p 127.0.0.1:5000:5000 \
            -e MONGODB_URI=mongodb://mongo:27017/metamuseum \
            -e SECRET_KEY=ci -e SECURITY_PASSWORD_SALT=ci metamuseum:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:5000/health
          curl -fsS http://127.0.0.1:5000/ | grep -q 'id="root"'
          curl -fsS -X POST http://127.0.0.1:5000/visitor-capability | grep -q 'capability'
          docker exec ci_smoke python -c "import importlib.util; assert all(importlib.util.find_spec(m) is None for m in ['flask','flask_admin','flask_socketio','eventlet'])"
          docker exec ci_smoke ffmpeg -version
      - name: Runtime diagnostics and cleanup
        if: always()
        run: |
          if [ -f /tmp/metamuseum-rtsp.pid ]; then kill "$(cat /tmp/metamuseum-rtsp.pid)" 2>/dev/null || true; fi
          docker logs ci_smoke 2>/dev/null || true
          docker rm -f ci_smoke ci_mongo 2>/dev/null || true
          docker network rm metamuseum_ci 2>/dev/null || true
  production-inventory:
    if: github.event_name == 'workflow_dispatch' && (inputs.operation == 'inventory' || inputs.operation == '')
    runs-on: [self-hosted, jy-server]
    timeout-minutes: 15
    concurrency:
      group: metamuseum-production-operations
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          path: .release-checkout
          persist-credentials: false
      - name: Inspect running production without changing services or data
        working-directory: .release-checkout
        run: bash scripts/release.sh inventory --code-manifest > "$RUNNER_TEMP/metamuseum-inventory.json"
      - name: Save sanitized production inventory
        uses: actions/upload-artifact@v4
        with:
          name: production-inventory-${{ github.run_id }}
          path: ${{ runner.temp }}/metamuseum-inventory.json
          if-no-files-found: error
          retention-days: 14
