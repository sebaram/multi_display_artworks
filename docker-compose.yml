services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metamuseum_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # Application secrets
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - SECURITY_PASSWORD_SALT=${SECURITY_PASSWORD_SALT:?SECURITY_PASSWORD_SALT is required}
      # MongoDB
      - MONGODB_URI=mongodb://mongo:27017/metamuseum
      - MONGODB_DB=metamuseum
      - ALLOWED_ORIGINS=["http://localhost:5000","http://127.0.0.1:5000"]
      # Email
      - MAIL_SERVER=smtp.gmail.com
      - MAIL_PORT=465
      - MAIL_USE_SSL=True
      - MAIL_USERNAME=your@gmail.com
      - MAIL_PASSWORD=your-app-password
      - MAIL_DEFAULT_SENDER=your@gmail.com
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - wall_media:/app/wall_media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health',timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mongo:
    image: mongo:7
    container_name: metamuseum_mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo_data:
  wall_media:
