<html>
  <head>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.rawgit.com/mrturck/aframe-joystick/master/joystick.min.js"></script>
    <script src="https://quadjr.github.io/aframe-gaussian-splatting/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.5/dist/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

    {% if is_ar_marker %}
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
    {% endif %}
  </head>
  <body>
    <a-scene joystick
      {% if is_ar_marker %}embedded arjs="sourceType: webcam; debugUIEnabled: false;" xr-mode-ui="enabled: false"{% elif is_ar_companion %}xr-mode-ui="enabled: false"{% else %}xr-mode-ui="enabled: false" cursor="rayOrigin: mouse"{% endif %}>
      <a-assets></a-assets>

      {% if not is_ar_marker %}
      <a-sky color="#1a1a2e"></a-sky>
      {% endif %}

      <a-camera id="camera" {% if spawn_preset %}position="{{ spawn_preset['position'] }}" rotation="{{ spawn_preset['rotation'] }}"{% endif %} {% if not is_ar_marker and not is_ar_companion %}boundary-clamp="minX: {{ boundary.min_x }}; maxX: {{ boundary.max_x }}; minY: {{ boundary.min_y }}; maxY: {{ boundary.max_y }}; minZ: {{ boundary.min_z }}; maxZ: {{ boundary.max_z }}"{% endif %}></a-camera>

      {% if is_ar_marker %}
      <a-marker preset="hiro" id="default-hiro-marker">
        <a-entity visible="false"></a-entity>
      </a-marker>
      {% endif %}

      {% for one_ele in aframe_list %}
        {{ one_ele|safe }}
      {% endfor %}
    </a-scene>

    <div id="room-toolbar" style="position:fixed;top:12px;left:12px;right:12px;z-index:9999;display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap;pointer-events:none;"></div>

    <script id="room-bootstrap" type="application/json">
      {
        "visitorCapabilityUrl": {{ visitor_capability_url | tojson }},
        "avatarCatalog": {{ avatar_catalog | tojson }},
        "roomId": {{ room_id | tojson }},
        "presets": {{ presets | tojson }},
        "boundary": {{ boundary | tojson }},
        "wallList": {{ wall_list | tojson }},
        "roomControlsEnabled": {{ 'false' if is_ar_marker or is_ar_companion else 'true' }},
        "isAdmin": {{ 'true' if drag_enabled else 'false' }},
        "syncDebugEnabled": {{ 'true' if sync_debug else 'false' }},
        "isArMarker": {{ 'true' if is_ar_marker else 'false' }},
        "isArCompanion": {{ 'true' if is_ar_companion else 'false' }}
      }
    </script>
    <script type="module" src="{{url_for('static', filename='js/room/bootstrap.js')}}"></script>
  </body>
</html>
